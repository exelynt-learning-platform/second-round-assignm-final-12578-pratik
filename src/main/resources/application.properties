spring.application.name=e-commerce-backend

server.port = 5454
# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url= jdbc:mysql://localhost:3306/e_commerce_backend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Show SQL in console
spring.jpa.show-sql=true

# Update tables automatically
spring.jpa.hibernate.ddl-auto=update

# Format the SQL output
spring.jpa.properties.hibernate.format_sql=true

jwt.secret = ${JWT_SECRET}
jwt.expiration = 172800000

logging.level.org.springframework.security = DEBUG
logging.level.com.multigenesystask = ERROR


razorpay.api.key = ${RAZORPAY_API}
razorpay.api.secret = ${RAZORPAY_SECRET}
app.payment.callback-url=${PAYMENT_CALLBACK_URL:http://localhost:5454/api/payments}


# ===============================
# CORS CONFIG
# ===============================

# Comma-separated allowed origins \u2014 override in prod via env var
app.cors.allowed-origins=http://localhost:4200



app.payment.currency=INR
app.payment.callback-method=get


