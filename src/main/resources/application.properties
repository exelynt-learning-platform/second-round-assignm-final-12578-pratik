spring.application.name=e-commerce-backend
# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/ecommercebackend?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# HIBERNATE / JPA CONFIG
# ===============================

# Dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Show SQL in console
spring.jpa.show-sql=true

# Update tables automatically
spring.jpa.hibernate.ddl-auto=update

# Format the SQL output
spring.jpa.properties.hibernate.format_sql=true

jwt.secret = 5208f4e6b75fbe67ada513f3a1b32bf9eccfa8093008d2418abbabe2221eaefc
jwt.expiration = 172800000

logging.level.org.springframework.security = DEBUG
logging.level.org.url.shortner = DEBUG